name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install
      - run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Licencias
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Android + MainActivity limpio
        shell: bash
        run: |
          set -e
          npx cap add android || true
          npx cap sync android

          mkdir -p android/app/src/main/java/com/taichix/app/plugins
          if [ -f android-plugin/src/main/java/com/taichix/app/plugins/ServerNativePlugin.java ]; then
            cp android-plugin/src/main/java/com/taichix/app/plugins/ServerNativePlugin.java \
               android/app/src/main/java/com/taichix/app/plugins/ServerNativePlugin.java
          fi

          python3 -c '
          from pathlib import Path
          p = Path("android/app/src/main/java/com/taichix/app/MainActivity.java")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text("package com.taichix.app;\n\nimport android.os.Bundle;\nimport android.util.Log;\nimport com.getcapacitor.BridgeActivity;\nimport com.taichix.app.plugins.ServerNativePlugin;\n\npublic class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        try {\n            registerPlugin(ServerNativePlugin.class);\n        } catch (Throwable t) {\n            Log.e(\"TaichiX\", \"plugin\", t);\n        }\n        super.onCreate(savedInstanceState);\n    }\n}\n")
          print(p.read_text())
          '

          # NO tocar capacitor.plugins.json (el sync ya lo genera bien)
          echo "MainActivity listo"

      - name: APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: taichix-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
