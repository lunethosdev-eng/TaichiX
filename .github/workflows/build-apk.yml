name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install
      - run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Licencias
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Android + MainActivity limpio
        shell: bash
        run: |
          set -e
          npx cap add android || true
          npx cap sync android

          mkdir -p android/app/src/main/java/com/taichix/app/plugins
          if [ -f android-plugin/src/main/java/com/taichix/app/plugins/ServerNativePlugin.java ]; then
            cp android-plugin/src/main/java/com/taichix/app/plugins/ServerNativePlugin.java \
               android/app/src/main/java/com/taichix/app/plugins/ServerNativePlugin.java
          fi

          python3 -c '
from pathlib import Path
p = Path("android/app/src/main/java/com/taichix/app/MainActivity.java")
p.parent.mkdir(parents=True, exist_ok=True)
p.write_text("""package com.taichix.app;

import android.os.Bundle;
import android.util.Log;
import com.getcapacitor.BridgeActivity;
import com.taichix.app.plugins.ServerNativePlugin;

public class MainActivity extends BridgeActivity {
    @Override
    public void onCreate(Bundle savedInstanceState) {
        try {
            registerPlugin(ServerNativePlugin.class);
        } catch (Throwable t) {
            Log.e(\"TaichiX\", \"plugin\", t);
        }
        super.onCreate(savedInstanceState);
    }
}
""")
print(p.read_text())
'
          # NO reescribir capacitor.plugins.json (cap sync lo genera bien)
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            grep -q 'android.permission.INTERNET' "$MANIFEST" || \
              sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
            grep -q 'usesCleartextTraffic' "$MANIFEST" || \
              sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST" || true
          fi
          echo "OK"

      - name: APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: taichix-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
