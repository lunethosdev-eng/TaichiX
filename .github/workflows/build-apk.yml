name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Capacitor Android and plugin
        shell: bash
        run: |
          set -e
          npx cap add android || true
          npx cap sync android

          mkdir -p android/app/src/main/java/com/taichix/app/plugins
          if [ -f android-plugin/src/main/java/com/taichix/app/plugins/ServerNativePlugin.java ]; then
            cp android-plugin/src/main/java/com/taichix/app/plugins/ServerNativePlugin.java \
               android/app/src/main/java/com/taichix/app/plugins/ServerNativePlugin.java
            echo "Plugin copiado"
          else
            echo "AVISO: ServerNativePlugin.java no encontrado"
          fi

          mkdir -p android/app/src/main/java/com/taichix/app
          cat > android/app/src/main/java/com/taichix/app/MainActivity.java << 'JAVA'
          package com.taichix.app;

          import android.os.Bundle;
          import android.util.Log;
          import com.getcapacitor.BridgeActivity;
          import com.taichix.app.plugins.ServerNativePlugin;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  try {
                      registerPlugin(ServerNativePlugin.class);
                  } catch (Throwable t) {
                      Log.e("TaichiX", "plugin", t);
                  }
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

          sed -i 's/^          //' android/app/src/main/java/com/taichix/app/MainActivity.java
          echo "=== MainActivity ==="
          cat android/app/src/main/java/com/taichix/app/MainActivity.java

          # Android 10+ bloquea exec() si targetSdk >= 29. Bajar a 28 para poder ejecutar Java descargado.
          GRADLE_APP="android/app/build.gradle"
          if [ -f "$GRADLE_APP" ]; then
            sed -i 's/targetSdkVersion[[:space:]]*[0-9][0-9]*/targetSdkVersion 28/' "$GRADLE_APP" || true
            sed -i 's/targetSdk[[:space:]]*[0-9][0-9]*/targetSdk 28/' "$GRADLE_APP" || true
            if ! grep -q 'targetSdkVersion 28' "$GRADLE_APP"; then
              sed -i '/defaultConfig {/a\        targetSdkVersion 28' "$GRADLE_APP" || true
            fi
            echo "=== app build.gradle (sdk) ==="
            grep -n "targetSdk\|minSdk\|compileSdk" "$GRADLE_APP" || true
          fi

          if [ -f android/variables.gradle ]; then
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 28/' android/variables.gradle || true
            echo "=== variables.gradle ==="
            cat android/variables.gradle
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            grep -q 'android.permission.INTERNET' "$MANIFEST" || \
              sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
            grep -q 'usesCleartextTraffic' "$MANIFEST" || \
              sed -i 's/<application /<application android:usesCleartextTraffic="true" android:extractNativeLibs="true" /' "$MANIFEST" || true
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taichix-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
