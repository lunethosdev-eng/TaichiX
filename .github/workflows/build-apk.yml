name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Add Capacitor Android platform + register native plugin
        shell: bash
        run: |
          set -e

          npx cap add android || true

          echo "=== Preparando plugin nativo ServerNative ==="

          # 1. Copiar el plugin Java
          mkdir -p android/app/src/main/java/com/taichix/app/plugins
          if [ -f "android-plugin/src/main/java/com/taichix/app/plugins/ServerNativePlugin.java" ]; then
            cp android-plugin/src/main/java/com/taichix/app/plugins/ServerNativePlugin.java \
               android/app/src/main/java/com/taichix/app/plugins/
            echo "✅ ServerNativePlugin.java copiado"
          else
            echo "❌ ERROR: ServerNativePlugin.java no encontrado"
            exit 1
          fi

          # 2. Crear capacitor.plugins.json
          mkdir -p android/app/src/main/assets
          cat > android/app/src/main/assets/capacitor.plugins.json << 'EOF'
          [
            {
              "pkg": "@capacitor/core",
              "classpath": "com.getcapacitor.Bridge"
            },
            {
              "pkg": "com.taichix.app",
              "classpath": "com.taichix.app.plugins.ServerNativePlugin"
            }
          ]
          EOF
          echo "✅ capacitor.plugins.json creado"

          # 3. REGISTRAR el plugin en MainActivity (OBLIGATORIO)
          MAIN_ACTIVITY=$(find android -name "MainActivity.java" | head -1)
          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "❌ No se encontró MainActivity.java"
            find android -name "*.java" | head -20
            exit 1
          fi
          echo "MainActivity encontrado: $MAIN_ACTIVITY"

          if grep -q "ServerNativePlugin" "$MAIN_ACTIVITY"; then
            echo "✅ Plugin ya estaba registrado en MainActivity"
          else
            if grep -q "super.onCreate" "$MAIN_ACTIVITY"; then
              sed -i '/super\.onCreate/i\        registerPlugin(com.taichix.app.plugins.ServerNativePlugin.class);' "$MAIN_ACTIVITY"
              echo "✅ registerPlugin añadido antes de super.onCreate"
            else
              echo "⚠️ No encontré super.onCreate, revisa MainActivity manualmente"
            fi
          fi

          echo "--- Contenido de MainActivity ---"
          cat "$MAIN_ACTIVITY"
          echo "--------------------------------"

          # 4. Permisos de red
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
              sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
            fi
            if ! grep -q 'android:usesCleartextTraffic' "$MANIFEST"; then
              sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST" || true
            fi
            echo "✅ Permisos de red revisados"
          fi

          npx cap sync android
          echo "✅ cap sync completado"

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: taichix-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

